<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>OpenDevice, sewa iPhone harian dan mingguan</title>
    <meta
      name="description"
      content="OpenDevice menyewakan iPhone harian dan mingguan untuk kebutuhan kerja, konten, dan perjalanan. Unit siap pakai, harga terbuka, tanpa biaya tersembunyi."
    />
    <meta property="og:title" content="OpenDevice, sewa iPhone harian dan mingguan" />
    <meta
      property="og:description"
      content="Pilih unit, tentukan durasi, ambil di toko atau minta dikirim. Harga harian dan mingguan tercantum terbuka."
    />
    <meta property="og:type" content="website" />
    <script>
      // Pasang tema sebelum React dimuat supaya tidak ada kedipan.
      // Bawaan SELALU terang. Preferensi sistem sengaja tidak dibaca, karena
      // pemilik project ingin website selalu terbuka dalam mode terang.
      // Tema gelap hanya berlaku bila pengguna sudah memilihnya sendiri,
      // dan pilihan itu tersimpan di localStorage.
      (function () {
        var theme = 'light'
        try {
          var stored = window.localStorage.getItem('opendevice-theme')
          if (stored === 'dark') {
            theme = 'dark'
          }
        } catch (error) {
          theme = 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta !== null) {
          meta.setAttribute('content', theme === 'dark' ? '#0b0b0d' : '#ffffff')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
